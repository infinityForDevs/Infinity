<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenges • Infinity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="homepage.css">
</head>

<body>

<svg style="display:none">
  <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/>
  </symbol>
  <symbol id="icon-trophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/>
    <path d="M7 5H4a1 1 0 0 0-1 1c0 3 2 5 4 5M17 5h3a1 1 0 0 1 1 1c0 3-2 5-4 5"/>
  </symbol>
  <symbol id="icon-feed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1.5" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
  </symbol>
</svg>

<div class="app-shell" id="appShell">

  <main class="challenge-page">
    <div class="challenge-heading">
      <h1 class="challenge-title">Challenges</h1>
      <p class="challenge-sub">Browse dev profiles and see who's climbing the board.</p>
    </div>

    <section class="search-section">
      <div class="search-box">
        <svg width="16" height="16"><use href="#icon-search"></use></svg>
        <input type="text" id="profileSearch" placeholder="search profiles...">
      </div>
    </section>

    <section class="profile-list" id="profileList">
      <!-- profile cards injected via JS -->
    </section>

    <p class="profile-empty" id="profileEmpty" hidden>No profiles match your search.</p>
  </main>

  <!-- ============================================================
        BOTTOM NAV
  ============================================================ -->
  <nav class="bottom-nav">
    <a href="https://infinityfordevs.github.io/Infinity/homepage.html" class="bottom-nav-link active">
      <svg width="20" height="20"><use href="#icon-trophy"></use></svg>
      <span>Challenge</span>
    </a>
    <a href="https://infinityfordevs.github.io/Infinity/feeds.html" class="bottom-nav-link">
      <svg width="20" height="20"><use href="#icon-feed"></use></svg>
      <span>Feeds</span>
    </a>
    <a href="https://infinityfordevs.github.io/Infinity/profile.html" class="bottom-nav-link">
      <svg width="20" height="20"><use href="#icon-user"></use></svg>
      <span>Profile</span>
    </a>
  </nav>

</div>

<script>
/* DUMMY PROFILE DATA */
const PROFILES = [
  { name: "sensa",       level: "Level 14", points: 2140, avatar: "/IMG-20260728-WA8256.jpg" },
  { name: "rowan_dev",   level: "Level 11", points: 1875, avatar: "/IMG-20260728-WA8256.jpg" },
  { name: "t.izzy",      level: "Level 9",  points: 1420, avatar: "/IMG-20260728-WA8256.jpg" },
  { name: "devon.k",     level: "Level 17", points: 2960, avatar: "/IMG-20260728-WA8256.jpg" },
  { name: "marley_codes",level: "Level 6",  points: 810,  avatar: "/IMG-20260728-WA8256.jpg" },
  { name: "kwame.js",    level: "Level 13", points: 2005, avatar: "/IMG-20260728-WA8256.jpg" },
  { name: "priya_dev",   level: "Level 20", points: 3510, avatar: "/IMG-20260728-WA8256.jpg" },
  { name: "noah_ships",  level: "Level 8",  points: 1290, avatar: "/IMG-20260728-WA8256.jpg" }
];

const profileList  = document.getElementById("profileList");
const profileEmpty = document.getElementById("profileEmpty");
const searchInput  = document.getElementById("profileSearch");

function renderProfiles(list) {
  profileList.innerHTML = "";
  list.forEach(p => {
    const card = document.createElement("button");
    card.className = "profile-card";
    card.type = "button";
    card.innerHTML = `
      <img src="${p.avatar}" class="profile-card-avatar" alt="">
      <div class="profile-card-info">
        <div class="profile-card-name">${p.name}</div>
        <div class="profile-card-level">${p.level}</div>
      </div>
      <div class="profile-card-points">${p.points.toLocaleString()}<span>pts</span></div>
    `;
    // Profile click — handled elsewhere
    card.addEventListener("click", () => {});
    profileList.appendChild(card);
  });
  profileEmpty.hidden = list.length !== 0;
}

renderProfiles(PROFILES);

searchInput.addEventListener("input", () => {
  const q = searchInput.value.trim().toLowerCase();
  const filtered = PROFILES.filter(p => p.name.toLowerCase().includes(q));
  renderProfiles(filtered);
});
</script>

</body>
</html>

<div class="app-shell">

  <div class="sidebar-overlay" id="sidebarBackdrop"></div>

  <aside class="sidebar" id="sidebarDrawer">
    <header class="sidebar-header">
      <div class="sidebar-brand">
        <span class="brand-logo"><svg width="24" height="24"><use href="#icon-brand"></use></svg></span>
        <div><h2>Infinity</h2></div>
      </div>
      <button class="icon-btn" id="closeSidebarBtn" aria-label="Close menu">
        <svg width="20" height="20"><use href="#icon-close"></use></svg>
      </button>
    </header>

    <nav class="sidebar-nav">
      <a class="sidebar-link" href="/homepage.html">
        <svg width="20" height="20"><use href="#icon-home"></use></svg><span>Feeds</span>
      </a>
      <a class="sidebar-link" href="/resources/resources.html">
        <svg width="20" height="20"><use href="#icon-post"></use></svg><span>Create Post</span>
      </a>
      <a class="sidebar-link" href="/profile/profile.html">
        <svg width="20" height="20"><use href="#icon-profile"></use></svg><span>Profile</span>
      </a>
      <a class="sidebar-link" href="/bookmarks/bookmarks.html">
        <svg width="20" height="20"><use href="#icon-bookmark"></use></svg><span>Bookmarks</span>
      </a>
      <a class="sidebar-link" href="/snippets/snippets.html">
        <svg width="20" height="20"><use href="#icon-code"></use></svg><span>Snippets</span>
      </a>
      <a class="sidebar-link" href="/jobs/jobs.html">
        <svg width="20" height="20"><use href="#icon-briefcase"></use></svg><span>Jobs</span>
      </a>
      <a class="sidebar-link pro-link" href="/pro/pro.html">
        <svg width="20" height="20"><use href="#icon-spark"></use></svg><span>Upgrade to Pro</span>
      </a>

      <div class="sidebar-divider"></div>

      <a class="sidebar-link" href="/settings/settings.html">
        <svg width="20" height="20"><use href="#icon-settings"></use></svg><span>Settings</span>
      </a>
      <a class="sidebar-link" href="/legal/privacy.html">
        <svg width="20" height="20"><use href="#icon-shield"></use></svg><span>Privacy Policy</span>
      </a>

        <svg width="20" height="20"><use href="#icon-file-text"></use></svg><span>Terms Of Service</span>
      </a>

      </a>

        <svg width="20" height="20"><use href="#icon-mail"></use></svg><span>Contact</span>
      </a>

      </a>
    </nav>
  </aside>

  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" id="hamburger-menu" aria-label="Open menu">
        <svg width="22" height="22"><use href="#icon-hamburger"></use></svg>
      </button>
      <div class="brand">
        <span class="brand-title">Infinity</span>
        <span class="brand-tag"><svg width="26" height="26"><use href="#icon-brand"></use></svg></span>
      </div>
    </div>
  </header>

  <!-- ============================================================
       CONTACT CONTENT
  ============================================================ -->
  <main class="contact-page">

    <div class="contact-hero">
      <svg width="34" height="34"><use href="#icon-mail"></use></svg>
      <h1>Contact Us</h1>
      <p class="contact-sub">Questions, bug reports, feedback </p>
    </div>

    <div class="contact-layout">

      <!-- Direct info -->

      <!-- Form -->
      <form class="contact-form" id="contactForm">

        <div class="form-row">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required>
        </div>

        <div class="form-row">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="form-row">
          <label for="topic">Topic</label>
          <select id="topic" name="topic">
            <option value="general">General question</option>
            <option value="bug">Bug report</option>
            <option value="feature">Feature request</option>
            <option value="account">Account issue</option>
            <option value="other">Something else</option>
          </select>
        </div>

        <div class="form-row">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" placeholder="Tell us what's going on..." required></textarea>
        </div>

        <button type="submit" class="submit-btn">
          <svg width="16" height="16"><use href="#icon-send"></use></svg>
          <span>Send Message</span>
        </button>

        <div class="form-success" id="formSuccess">
          <svg width="18" height="18"><use href="#icon-check-circle"></use></svg>
          <span>Thanks — your message has been sent.</span>
        </div>

      </form>

    </div>
  </main>

</div>

<script>
const sidebar  = document.getElementById("sidebarDrawer");
const backdrop = document.getElementById("sidebarBackdrop");
const openBtn  = document.getElementById("hamburger-menu");
const closeBtn = document.getElementById("closeSidebarBtn");

function openSidebar() {
  sidebar.classList.add("open");
  backdrop.classList.add("show");
  document.body.style.overflow = "hidden";
}
function closeSidebar() {
  sidebar.classList.remove("open");
  backdrop.classList.remove("show");
  document.body.style.overflow = "";
}
openBtn.addEventListener("click", openSidebar);
closeBtn.addEventListener("click", closeSidebar);
backdrop.addEventListener("click", closeSidebar);

/* FORM SUBMIT — placeholder until wired to a real endpoint */
const form = document.getElementById("contactForm");
const success = document.getElementById("formSuccess");

form.addEventListener("submit", (e) => {
  e.preventDefault();
  success.classList.add("show");
  form.reset();
  setTimeout(() => success.classList.remove("show"), 4000);
});
</script>

</body>
</html>

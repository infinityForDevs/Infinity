<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — Infinity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="settings.css">
</head>

<body>

  <!-- Icon sprite -->
  <svg style="display:none">
    <symbol id="icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
      <circle cx="12" cy="7" r="4"></circle>
    </symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
    </symbol>
    <symbol id="icon-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
    </symbol>
    <symbol id="icon-card" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
      <line x1="1" y1="10" x2="23" y2="10"></line>
    </symbol>
  </svg>

  <div class="container">

    <section class="top-section">
      <div class="post-heading">// settings</div>
      <p class="page-sub">Tap a category or use the search bar.</p>

      <div class="settings-grid">

        <button class="setting-btn">
          <span class="setting-icon">
            <svg width="20" height="20"><use href="#icon-user"></use></svg>
          </span>
          <span class="setting-text">
            <span class="setting-title">Account</span>
            <span class="setting-desc">Profile, username, password</span>
          </span>
        </button>

        <button class="setting-btn">
          <span class="setting-icon">
            <svg width="20" height="20"><use href="#icon-shield"></use></svg>
          </span>
          <span class="setting-text">
            <span class="setting-title">Privacy &amp; Security</span>
            <span class="setting-desc">2FA, sessions, data controls</span>
          </span>
        </button>

        <button class="setting-btn">
          <span class="setting-icon">
            <svg width="20" height="20"><use href="#icon-bell"></use></svg>
          </span>
          <span class="setting-text">
            <span class="setting-title">Notifications</span>
            <span class="setting-desc">Email, push, mentions</span>
          </span>
        </button>

        <button class="setting-btn">
          <span class="setting-icon">
            <svg width="20" height="20"><use href="#icon-card"></use></svg>
          </span>
          <span class="setting-text">
            <span class="setting-title">Billing &amp; Plan</span>
            <span class="setting-desc">Subscription, invoices</span>
          </span>
        </button>

      </div>
    </section>

  </div>

</body>
</html>

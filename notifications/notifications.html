<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Infinity Notifications</title>
<link rel="stylesheet" href="notifications.css">

</head>

<body>
  
    <div class="np-header">
        <a href="/homepage/homepage.html">
            <button class="np-back-btn">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
</button>
        </a>
        <h2 class="np-title">Notifications</h2>
        <button class="np-clear-btn" id="clearNotificationsBtn">Clear all</button>
    </div>
    
    <div class="np-body">
        <div class="notification-item unread">
            <div class="ni-avatar">🔔</div>
            <div class="ni-content">
                <p class="ni-text"><strong>@alex_dev</strong> liked your post in <strong>r/AskInfinity</strong></p>
                <span class="ni-time">2m ago</span>
            </div>
            <div class="ni-status-dot"></div>
        </div>

        <div class="notification-item">
            <div class="ni-avatar">🚀</div>
            <div class="ni-content">
                <p class="ni-text">Your draft <strong>"Infinity Launch"</strong> was successfully saved to your storage.</p>
                <span class="ni-time">1h ago</span>
            </div>
        </div>

        <div class="notification-item">
            <div class="ni-avatar">💬</div>
            <div class="ni-content">
                <p class="ni-text"><strong>@sarah_codes</strong> commented on your coding submission.</p>
                <span class="ni-time">5h ago</span>
            </div>
        </div>
    </div>
<script>
    // ==========================================
// 7. NOTIFICATIONS PANEL INTERACTION ENGINE
// ==========================================
const clearNotificationsBtn = document.getElementById('clearNotificationsBtn');
const notificationItems = document.querySelectorAll('.notification-item');


}

// Optional: Dismiss an unread dot indicator when clicking a notification
notificationItems.forEach(item => {
    item.addEventListener('click', () => {
        item.classList.remove('unread');
        const dot = item.querySelector('.ni-status-dot');
        if (dot) dot.remove();
    });
});

// Optional: Clear all notifications dynamically
if (clearNotificationsBtn && notificationsDrawer) {
    clearNotificationsBtn.addEventListener('click', () => {
        const body = notificationsDrawer.querySelector('.np-body');
        if (body) {
            body.innerHTML = `<div class="dh-empty-state">All caught up! No new notifications.</div>`;
        }
    });
}

</script>
</body>

</html>
